version: "3.9"

services:
  admin-api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../apps/admin-api:/app
    command: sh -c "npm install && npm start"
    environment:
      - PORT=8080
      - ADMIN_TOKEN=dev-admin-token
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=psychic
      - POSTGRES_USER=psychic
      - POSTGRES_PASSWORD=psychic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
